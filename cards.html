<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สำรวจการ์ดทั้งหมด — คุ้มครองชีวิต พิชิตโซเดียม</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗂️</text></svg>">
<style>
  :root{
    /* base = "ขาว" (light) — matches the main game's default theme exactly */
    --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#EDE8DA;
    --text:#1a1a16; --text-dim:#4a473e; --border:#8a8370;
    --accent:#C98A2C; --accent-text:#7a4f18;

    --mission:#1565C0; --food:#C97A00; --obstacle:#C22A2A; --support:#8E24AA; --knowledge:#1E8E3E;
    --zone-green:#1E8E3E; --zone-yellow:#C97A00; --zone-red:#C22A2A;
    --shadow: 0 1px 2px rgba(36,28,16,0.06), 0 8px 24px -12px rgba(36,28,16,0.18);
    --radius: 14px;
    --text-zoom: 1.2;

    /* aliases used throughout this stylesheet, derived from the theme above */
    --ink: var(--text);
    --ink-dim: var(--text-dim);
    --border-strong: color-mix(in srgb, var(--border) 55%, var(--text));
    --accent-strong: var(--accent-text);
    --accent-soft: color-mix(in srgb, var(--accent) 20%, var(--surface));
  }
  /* ธีมดำ/เขียว/แดง/ฟ้า/Colorful — สีเดียวกับตัวเกมหลัก (sodium-quest-mvp.html) */
  html[data-theme="dark"]{
    --bg:#141414; --surface:#1e1e1e; --surface-2:#2a2a2a; --border:#5a5a5a;
    --accent:#E0A72E; --accent-text:#F2C14E; --text:#FFFFFF; --text-dim:#D0CCC0;
  }
  html[data-theme="green"]{
    --bg:#0A2418; --surface:#123626; --surface-2:#1B4A34; --border:#5c8a71;
    --accent:#F2C14E; --accent-text:#FFD670; --text:#FFFFFF; --text-dim:#dbe6db;
  }
  html[data-theme="red"]{
    --bg:#2A0E0E; --surface:#3D1414; --surface-2:#4F1C1C; --border:#9a5a5a;
    --accent:#F2C14E; --accent-text:#FFD670; --text:#FFFFFF; --text-dim:#f0d9d3;
  }
  html[data-theme="blue"]{
    --bg:#0E1B2E; --surface:#152A45; --surface-2:#1D3A5C; --border:#5a7aa8;
    --accent:#F2B84E; --accent-text:#FFCD70; --text:#FFFFFF; --text-dim:#cfe0ec;
  }
  html[data-theme="colorful"]{
    --bg:#2A1240; --surface:#3D1A5C; --surface-2:#4E2378; --border:#a06fd0;
    --accent:#FF8A50; --accent-text:#FFB27A; --text:#FFFFFF; --text-dim:#ecdcf7;
  }
  *{box-sizing:border-box;}
  .hidden{ display:none !important; }
  body{
    margin:0;
    zoom: var(--text-zoom);
    background: radial-gradient(circle at 1px 1px, rgba(128,110,60,0.10) 1px, transparent 0) 0 0/22px 22px, var(--bg);
    color:var(--ink); font-family:'Sarabun','Noto Sans Thai','Leelawadee UI',system-ui,sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  a{ color:var(--accent-strong); }
  h1{ margin:0; text-wrap:balance; }
  .wrap{ max-width:1100px; margin:0 auto; padding:0 20px 80px; }

  .topbar{
    position:sticky; top:0; z-index:20;
    background:color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter:blur(6px); border-bottom:1px solid var(--border);
  }
  .topbar-inner{ max-width:1100px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .back{
    flex:none; font-size:12.5px; font-weight:700; text-decoration:none;
    color:var(--accent-strong); background:var(--accent-soft);
    padding:6px 12px; border-radius:999px; border:1px solid var(--accent-soft); white-space:nowrap;
  }
  .topbar h1{ font-size:16px; font-weight:800; flex:1; min-width:160px; }
  .manual-link{ font-size:12.5px; font-weight:700; text-decoration:none; color:var(--ink-dim); }

  .theme-select{
    flex:none; font-size:12.5px; font-weight:700; font-family:inherit; color:var(--ink-dim);
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:6px 8px;
  }
  .font-ctl{ display:flex; align-items:center; gap:4px; flex:none; }
  .font-ctl button{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:var(--surface);
    color:var(--ink-dim); font-weight:800; cursor:pointer; font-family:inherit; line-height:1;
  }
  .font-ctl button:first-child{ font-size:12px; }
  .font-ctl button:last-child{ font-size:16px; }
  .font-ctl button:hover{ border-color:var(--accent); color:var(--ink); }

  .hero{ padding:36px 0 20px; text-align:center; }
  .hero .sub{ font-size:14.5px; color:var(--ink-dim); max-width:560px; margin:8px auto 0; }

  .tabs{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:20px 0; }
  .tab{
    display:flex; align-items:center; gap:7px; font-size:13.5px; font-weight:700;
    padding:9px 16px; border-radius:999px; border:1px solid var(--border); background:var(--surface);
    cursor:pointer; color:var(--ink-dim); transition:transform .1s ease;
  }
  .tab:hover{ transform:translateY(-1px); }
  .tab .ic{ font-size:15px; }
  .tab.active{ color:#fff; border-color:transparent; box-shadow:var(--shadow); }

  .toolbar{ display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .search-box{
    flex:1; min-width:220px; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:10px 14px; font-size:14px; color:var(--ink);
    font-family:inherit;
  }
  .search-box:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .count-label{ font-size:12.5px; color:var(--ink-dim); font-variant-numeric:tabular-nums; white-space:nowrap; }

  .food-filters{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:20px; padding:12px 14px; background:var(--surface); border:1px solid var(--border); border-radius:12px; }
  .filter-group{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .filter-label{ font-size:12px; font-weight:800; color:var(--ink-dim); }
  .seg{ display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .seg button{
    font-size:12.5px; font-weight:700; padding:7px 12px; background:var(--surface);
    color:var(--ink-dim); border:none; border-right:1px solid var(--border); cursor:pointer; font-family:inherit;
  }
  .seg button:last-child{ border-right:none; }
  .seg button.active{ background:var(--food); color:#fff; }
  .zone-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
  .ccard{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column;
    border-top:4px solid var(--deck-color, var(--accent));
  }
  .cimg{ width:100%; height:130px; background-size:cover; background-position:center; background-color:var(--surface-2); flex:none; }
  .cbody{ padding:13px 14px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .ceyebrow{ font-size:10.5px; font-weight:800; letter-spacing:0.03em; }
  .cname{ font-weight:800; font-size:14.5px; line-height:1.35; }
  .cdesc{ font-size:12.5px; color:var(--ink-dim); line-height:1.55; }
  .ctag{
    align-self:flex-start; font-size:11px; font-weight:800; color:#fff;
    padding:3px 9px; border-radius:999px;
  }
  .cbadge{
    align-self:flex-start; font-size:10.5px; font-weight:800; color:var(--ink-dim);
    background:var(--surface-2); padding:2px 8px; border-radius:999px;
  }
  .view-btn{
    margin-top:4px; align-self:flex-start; font-size:12px; font-weight:700; font-family:inherit;
    padding:7px 13px; border-radius:8px; border:1px solid var(--deck-color, var(--accent));
    color:var(--deck-color, var(--accent)); background:transparent; cursor:pointer;
  }
  .view-btn:hover{ background:var(--deck-color, var(--accent)); color:#fff; }
  .loading, .empty{ grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--ink-dim); font-size:14px; }

  footer{ text-align:center; padding:40px 20px 10px; color:var(--ink-dim); font-size:12px; }

  /* ---------- preview modal (mimics the in-game card popup) ---------- */
  .preview-overlay{
    position:fixed; inset:0; background:rgba(20,15,5,0.55); z-index:100;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .preview-overlay.show{ display:flex; }
  .preview-box{
    background:var(--surface); border-radius:16px; max-width:480px; width:100%;
    max-height:85vh; overflow-y:auto; padding:20px; position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .pclose{
    position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%;
    border:1px solid var(--border); background:var(--surface); color:var(--ink-dim);
    font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .pclose:hover{ color:var(--ink); border-color:var(--accent); }
  .pctype{ display:inline-block; font-size:12px; font-weight:800; color:#fff; padding:4px 12px; border-radius:999px; margin-bottom:10px; }
  .preview-box h3{ font-size:19px; font-weight:800; margin-bottom:10px; }
  .pdesc{ font-size:14px; color:var(--ink-dim); line-height:1.65; margin-bottom:10px; }
  .preq{ font-size:13px; font-weight:700; background:var(--surface-2); padding:8px 12px; border-radius:8px; margin-bottom:10px; }
  .peffect{ font-size:13.5px; background:var(--surface-2); padding:8px 12px; border-radius:8px; margin-bottom:8px; }
  .phero{ width:calc(100% + 40px); margin:-20px -20px 12px; height:170px; background-size:cover; background-position:center; background-color:var(--support); display:flex; align-items:flex-end; }
  .phero-scrim{ width:100%; padding:14px 20px; background:linear-gradient(to top, rgba(0,0,0,.65), transparent); }
  .phero-scrim h3{ color:#fff; margin-bottom:0; }
  .pimg{ width:100%; max-height:190px; object-fit:cover; border-radius:10px; margin-bottom:10px; }
  .pchoices{ display:flex; flex-direction:column; gap:8px; }
  .choice-preview{ background:var(--surface-2); border-radius:8px; padding:10px 12px; }
  .choice-preview b{ font-size:13.5px; display:block; margin-bottom:4px; }
  .choice-eff{ font-size:12px; color:var(--ink-dim); }
</style>
</head>
<body>

<div class="topbar"><div class="topbar-inner">
  <a class="back" href="sodium-quest-mvp.html">← กลับไปเล่นเกม</a>
  <h1>🗂️ สำรวจการ์ดทั้งหมด</h1>
  <select class="theme-select" id="theme-select" title="ธีมสี">
    <option value="light">🎨 ขาว</option>
    <option value="dark">ดำ</option>
    <option value="green">เขียว</option>
    <option value="red">แดง</option>
    <option value="blue">ฟ้า</option>
    <option value="colorful">Colorful 🌈</option>
  </select>
  <div class="font-ctl">
    <button type="button" id="font-dec" title="ลดขนาดตัวอักษร">ก−</button>
    <button type="button" id="font-inc" title="เพิ่มขนาดตัวอักษร">ก+</button>
  </div>
  <a class="manual-link" href="manual.html">📖 คู่มือการเล่น</a>
</div></div>

<div class="wrap">
  <div class="hero">
    <p class="sub">ดูการ์ดทุกใบที่มีในเกม "คุ้มครองชีวิต พิชิตโซเดียม" ก่อนลงสนามจริง — เลือกประเภทการ์ดด้านล่าง แล้วค้นหาด้วยชื่อได้เลย</p>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="food-filters" id="food-filters">
    <div class="filter-group">
      <span class="filter-label">เรียงตามโซเดียม</span>
      <div class="seg" id="sort-seg">
        <button type="button" data-sort="desc" class="active">มาก → น้อย</button>
        <button type="button" data-sort="asc">น้อย → มาก</button>
      </div>
    </div>
    <div class="filter-group">
      <span class="filter-label">แสดงเฉพาะโซน</span>
      <div class="seg" id="zone-seg">
        <button type="button" data-zone="all" class="active">ทั้งหมด</button>
        <button type="button" data-zone="green"><span class="zone-dot" style="background:var(--zone-green);"></span>เขียว</button>
        <button type="button" data-zone="yellow"><span class="zone-dot" style="background:var(--zone-yellow);"></span>เหลือง</button>
        <button type="button" data-zone="red"><span class="zone-dot" style="background:var(--zone-red);"></span>แดง</button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <input class="search-box" id="search" type="text" placeholder="ค้นหาด้วยชื่อการ์ด...">
    <span class="count-label" id="count"></span>
  </div>
  <div class="grid" id="grid"><div class="loading">กำลังโหลดการ์ด...</div></div>
</div>

<footer>คุ้มครองชีวิต พิชิตโซเดียม — ข้อมูลการ์ดทั้งหมดตรงกับที่ใช้ในเกมจริง</footer>

<div class="preview-overlay" id="preview-overlay">
  <div class="preview-box">
    <button type="button" class="pclose" id="preview-close">✕</button>
    <div id="preview-body"></div>
  </div>
</div>

const ZONE_LABEL = { green:'เขียว - ปลอดภัย', yellow:'เหลือง - ระวัง', red:'แดง - เสี่ยง' };
const ZONE_SHORT = { green:'เขียว', yellow:'เหลือง', red:'แดง' };
const ZONE_COLOR = { green:'var(--zone-green)', yellow:'var(--zone-yellow)', red:'var(--zone-red)' };
const CARD_TH = { food:'อาหาร', knowledge:'ความรู้', support:'สนับสนุน' };

let activeDeck = 'food';
let searchTerm = '';
let foodSort = 'desc';
let foodZone = 'all';
let lastRendered = [];
const cache = {};

/* ---------- font size (zoom) control, shared across cards.html/manual.html ---------- */
// localStorage throws on opaque origins (e.g. opening this file directly via
// file://) — an unguarded call here would crash the whole inline script
// before any of the tabs/cards ever render, so every access is wrapped.
function safeLocalGet(key){ try { return localStorage.getItem(key); } catch(e) { return null; } }
function safeLocalSet(key, value){ try { localStorage.setItem(key, value); } catch(e) {} }
const ZOOM_KEY = 'upasm-text-zoom';
function applyZoom(z){
  z = Math.min(1.8, Math.max(0.8, z));
  document.documentElement.style.setProperty('--text-zoom', z);
  safeLocalSet(ZOOM_KEY, z);
}
(function initZoom(){
  const saved = parseFloat(safeLocalGet(ZOOM_KEY));
  applyZoom(isNaN(saved) ? 1.2 : saved);
})();
document.getElementById('font-inc').addEventListener('click', () => {
  applyZoom(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--text-zoom')) + 0.1);
});
document.getElementById('font-dec').addEventListener('click', () => {
  applyZoom(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--text-zoom')) - 0.1);
});

/* ---------- theme, shared with the main game via the same localStorage key ---------- */
const THEME_KEY = 'sodium_quest_theme';
function applyTheme(name){
  document.documentElement.setAttribute('data-theme', name);
  safeLocalSet(THEME_KEY, name);
  const sel = document.getElementById('theme-select');
  if(sel) sel.value = name;
}
(function initTheme(){
  applyTheme(safeLocalGet(THEME_KEY) || 'light');
})();
document.getElementById('theme-select').addEventListener('change', (e) => applyTheme(e.target.value));

const tabsEl = document.getElementById('tabs');
Object.keys(DECKS).forEach(key => {
  const d = DECKS[key];
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'tab' + (key === activeDeck ? ' active' : '');
  btn.dataset.deck = key;
  btn.style.background = key === activeDeck ? d.color : '';
  btn.innerHTML = `<span class="ic">${d.icon}</span><span>${d.label}</span>`;
  btn.addEventListener('click', () => selectDeck(key));
  tabsEl.appendChild(btn);
});

// Card data is embedded directly (see CARD_DECKS_DATA below, kept in sync
// with the *_cards_full.json files by scripts/generate-cards-embed.js) —
// NOT fetched at runtime. fetch()/XHR to a file:// origin is blocked by
// CORS in Chrome/Edge by default, which is exactly how this page is most
// often opened (double-clicked locally, no server) — a fetch() here would
// silently hang on "กำลังโหลดการ์ด..." forever for those users.
async function loadDeck(key){
  if(cache[key]) return cache[key];
  const data = CARD_DECKS_DATA[key] || [];
  cache[key] = data;
  return data;
}

function selectDeck(key){
  activeDeck = key;
  [...tabsEl.children].forEach(btn => {
    const isActive = btn.dataset.deck === key;
    btn.classList.toggle('active', isActive);
    btn.style.background = isActive ? DECKS[key].color : '';
  });
  document.getElementById('search').value = '';
  searchTerm = '';
  document.getElementById('food-filters').classList.toggle('hidden', key !== 'food');
  renderCurrent();
}

async function renderCurrent(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '<div class="loading">กำลังโหลดการ์ด...</div>';
  const cards = await loadDeck(activeDeck);
  const term = searchTerm.trim().toLowerCase();
  let filtered = term
    ? cards.filter(c => (c.name || c.title || '').toLowerCase().includes(term))
    : cards.slice();

  if(activeDeck === 'food'){
    if(foodZone !== 'all') filtered = filtered.filter(c => c.sodium.zone === foodZone);
    filtered.sort((a, b) => {
      const diff = (a.sodium.amountMg||0) - (b.sodium.amountMg||0);
      return foodSort === 'asc' ? diff : -diff;
    });
  }

  lastRendered = filtered;
  document.getElementById('count').textContent = `${filtered.length} / ${cards.length} ใบ`;
  grid.innerHTML = filtered.length
    ? filtered.map((c, i) => cardHTML(activeDeck, c, i)).join('')
    : '<div class="empty">ไม่พบการ์ดที่ตรงกับเงื่อนไข</div>';
}

function cardHTML(deckKey, c, idx){
  const d = DECKS[deckKey];
  const style = `style="--deck-color:${d.color}"`;
  if(deckKey === 'food'){
    const img = c.image?.src
      ? `<div class="cimg" style="background-image:url('${c.image.src}')"></div>`
      : `<div class="cimg" style="background:${ZONE_COLOR[c.sodium.zone]}"></div>`;
    return `<div class="ccard" ${style}>${img}<div class="cbody">
      <div class="cname">${c.name}</div>
      <span class="ctag" style="background:${ZONE_COLOR[c.sodium.zone]}">${Math.round(c.sodium.amountMg||0)} มก. · ${ZONE_LABEL[c.sodium.zone]}</span>
      <button type="button" class="view-btn" data-idx="${idx}">🔍 ดูการ์ด</button>
    </div></div>`;
  }
  if(deckKey === 'mission'){
    return `<div class="ccard" ${style}><div class="cbody">
      <div class="ceyebrow" style="color:${d.color}">หมู่บ้าน ${c.village}${c.villageName ? ' · ' + c.villageName : ''}</div>
      <div class="cname">${c.title}</div>
      <div class="cdesc">${c.scenario}</div>
      <button type="button" class="view-btn" data-idx="${idx}">🔍 ดูการ์ด</button>
    </div></div>`;
  }
  if(deckKey === 'obstacle'){
    return `<div class="ccard" ${style}><div class="cbody">
      <div class="cname">${c.name}</div>
      <div class="cdesc">${c.scenario}</div>
      ${c.scope === 'all' ? '<span class="cbadge">ผลกับทุกคน</span>' : ''}
      <button type="button" class="view-btn" data-idx="${idx}">🔍 ดูการ์ด</button>
    </div></div>`;
  }
  if(deckKey === 'support'){
    const img = c.image?.src ? `<div class="cimg" style="background-image:url('${c.image.src}')"></div>` : '';
    return `<div class="ccard" ${style}>${img}<div class="cbody">
      <div class="cname">${c.name}</div>
      <div class="cdesc">${c.scenario}</div>
      ${c.scope === 'all' ? '<span class="cbadge">ผลกับทุกคน</span>' : ''}
      <button type="button" class="view-btn" data-idx="${idx}">🔍 ดูการ์ด</button>
    </div></div>`;
  }
  if(deckKey === 'knowledge'){
    const img = c.image?.src ? `<div class="cimg" style="background-image:url('${c.image.src}')"></div>` : '';
    return `<div class="ccard" ${style}>${img}<div class="cbody">
      <div class="cname">${c.name}</div>
      <div class="cdesc">${c.knowledgeFact}</div>
      <button type="button" class="view-btn" data-idx="${idx}">🔍 ดูการ์ด</button>
    </div></div>`;
  }
  return '';
}

/* ---------- effect descriptions, mirroring the in-game wording ---------- */
function describeEffect(eff){
  if(eff.type === 'score') return `${eff.operation==='subtract'?'-':'+'}${eff.value} คะแนน`;
  if(eff.type === 'skipTurn') return `หยุดเดิน ${eff.value} ตา`;
  if(eff.type === 'discardCard') return `${eff.random ? 'สุ่มทิ้ง' : 'ทิ้ง'}การ์ด${CARD_TH[eff.cardType]||eff.cardType} ${eff.count} ใบ`;
  if(eff.type === 'drawCard'){
    const zone = eff.zone ? ` โซน${ZONE_SHORT[eff.zone]}` : '';
    return `ได้การ์ด${CARD_TH[eff.cardType]||eff.cardType}เพิ่ม ${eff.count} ใบ${zone}`;
  }
  if(eff.type === 'knowledgeCheck'){
    const withCard = eff.consume ? 'มีการ์ดความรู้ในมือ → ใช้รับมือสถานการณ์ (ทิ้ง 1 ใบ)' : 'มีการ์ดความรู้ในมือ → รับมือสถานการณ์ได้ ไม่เสียคะแนน';
    const without = eff.penaltyIfMissing ? `ไม่มีการ์ดความรู้ → ติดลบ ${eff.penaltyIfMissing} คะแนน` : 'ไม่มีการ์ดความรู้ (ไม่มีบทลงโทษ)';
    return `${withCard}<br>${without}`;
  }
  if(eff.type === 'swapFoodZone'){
    const to = eff.toZones.map(z=>ZONE_SHORT[z]).join('/');
    return `แลกการ์ดอาหารโซน${ZONE_SHORT[eff.fromZone]}ทั้งหมด เป็นโซน${to}`;
  }
  return eff.type;
}

/* ---------- preview modal: mirrors the styling used inside the actual game ---------- */
function openPreviewModal(deckKey, card){
  const d = DECKS[deckKey];
  let html = '';
  if(deckKey === 'food'){
    const img = card.image?.src ? `<img class="pimg" src="${card.image.src}" alt="${card.image.alt||card.name}">` : '';
    const sodiumMg = Math.round(card.sodium.amountMg || 0);
    const servingNote = card.sodium.servingNote ? ` (${card.sodium.servingNote})` : '';
    const warnIcons = (card.warningIcons||[]).map(w => w==='sugar' ? '🥄 หวาน' : '🧂 เค็ม').join('  ');
    const n = card.nutrition || {};
    const nutritionLine = (n.energyKcal!=null)
      ? `⚡ ${Math.round(n.energyKcal)} kcal · 🥓 ไขมัน ${n.fatG??'-'} ก. · 🍗 โปรตีน ${n.proteinG??'-'} ก. · 🍚 คาร์บ ${n.carbG??'-'} ก.`
      : '';
    html = `
      <span class="pctype" style="background:${ZONE_COLOR[card.sodium.zone]};">🧺 การ์ดเมนูอาหาร (กาดนัด)${warnIcons ? ' · '+warnIcons : ''}</span>
      <h3>${card.name}</h3>
      ${img}
      <div class="peffect">โซเดียม ${sodiumMg} มก.${servingNote} (${ZONE_LABEL[card.sodium.zone]})</div>
      ${nutritionLine ? `<div class="peffect">${nutritionLine}</div>` : ''}
      ${card.flavorText ? `<div class="pdesc">${card.flavorText}</div>` : ''}
    `;
  } else if(deckKey === 'mission'){
    const choices = (card.choices||[]).map(c => `<div class="choice-preview"><b>${c.label}</b><div class="choice-eff">${(c.effects||[]).map(describeEffect).join(' · ')}</div></div>`).join('');
    html = `
      <span class="pctype" style="background:${d.color};">🏠 ${card.title}</span>
      <h3>สถานการณ์</h3>
      <div class="pdesc">${card.scenario}</div>
      ${card.instructions ? `<div class="preq">📋 ${card.instructions}</div>` : ''}
      <div class="pchoices">${choices || '<div class="pdesc">ภารกิจนี้ให้เลือกการ์ดอาหารในมือแทนการเลือกข้อความ</div>'}</div>
    `;
  } else if(deckKey === 'obstacle'){
    const effLines = (card.effects||[]).map(e=>`<div class="peffect">${describeEffect(e)}</div>`).join('');
    html = `
      <span class="pctype" style="background:${d.color};">⚠️ การ์ดอุปสรรคหมู่บ้าน (ขึด)</span>
      <h3>${card.name}</h3>
      <div class="pdesc">${card.scenario}</div>
      ${card.scope==='all' ? '<div class="preq">⚠️ อุปสรรคนี้ส่งผลกับผู้เล่นทุกคน</div>' : ''}
      ${effLines}
    `;
  } else if(deckKey === 'support'){
    const heroBg = card.image?.src ? ` style="background-image:url('${card.image.src}')"` : '';
    const effLines = (card.effects||[]).map(e=>`<div class="peffect">${describeEffect(e)}</div>`).join('');
    html = `
      <div class="phero"${heroBg}><div class="phero-scrim"><span class="pctype" style="background:${d.color};">🏯 การ์ดสนับสนุนชุมชน</span><h3>${card.name}</h3></div></div>
      <div class="pdesc">${card.scenario}</div>
      ${card.scope==='all' ? '<div class="preq">🤝 การสนับสนุนนี้ส่งผลกับผู้เล่นทุกคน</div>' : ''}
      ${effLines}
    `;
  } else if(deckKey === 'knowledge'){
    const img = card.image?.src ? `<img class="pimg" src="${card.image.src}" alt="${card.image.alt||card.name}">` : '';
    html = `
      <span class="pctype" style="background:${d.color};">💡 การ์ดความรู้สุขภาพ</span>
      <h3>${card.name}</h3>
      ${img}
      <div class="pdesc">${card.knowledgeFact}</div>
      ${card.flavorText ? `<div class="peffect" style="font-style:italic;">"${card.flavorText}"</div>` : ''}
    `;
  }
  document.getElementById('preview-body').innerHTML = html;
  document.getElementById('preview-overlay').classList.add('show');
}
function closePreviewModal(){
  document.getElementById('preview-overlay').classList.remove('show');
}
document.getElementById('preview-close').addEventListener('click', closePreviewModal);
document.getElementById('preview-overlay').addEventListener('click', (e) => {
  if(e.target.id === 'preview-overlay') closePreviewModal();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') closePreviewModal();
});
document.getElementById('grid').addEventListener('click', (e) => {
  const btn = e.target.closest('.view-btn');
  if(!btn) return;
  const card = lastRendered[Number(btn.dataset.idx)];
  if(card) openPreviewModal(activeDeck, card);
});

/* ---------- food filter controls ---------- */
document.getElementById('sort-seg').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-sort]');
  if(!btn) return;
  foodSort = btn.dataset.sort;
  [...e.currentTarget.children].forEach(b => b.classList.toggle('active', b === btn));
  renderCurrent();
});
document.getElementById('zone-seg').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-zone]');
  if(!btn) return;
  foodZone = btn.dataset.zone;
  [...e.currentTarget.children].forEach(b => b.classList.toggle('active', b === btn));
  renderCurrent();
});

document.getElementById('search').addEventListener('input', (e) => {
  searchTerm = e.target.value;
  renderCurrent();
});

renderCurrent();
</script>
